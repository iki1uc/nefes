<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>nefes · küp · atom · reaksiyon</title>
<style>
  html,body{margin:0;height:100%;background:#05050c;color:#eee;
            font-family:monospace;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh}
  #bild{position:fixed;top:10px;left:10px;background:rgba(5,5,12,0.8);
        border:1px solid #1a1a2a;border-radius:4px;padding:10px 14px;
        font-size:11px;line-height:1.8;pointer-events:none;
        backdrop-filter:blur(2px);max-width:280px}
  #bild b{color:#ffcc44}
  #bild .maya{color:#00ffaa;font-size:10px}
  #bild .inka{color:#ff0066;font-size:10px}
  #bild .tr{color:#5fc8ff}
  #kontrol{position:fixed;bottom:10px;left:10px;display:flex;gap:6px;flex-wrap:wrap;
           max-width:calc(100vw - 20px)}
  .knopf{padding:8px 12px;background:rgba(0,255,170,0.05);color:#00ffaa;
         border:1px solid #00ffaa;border-radius:4px;cursor:pointer;
         font-family:monospace;font-size:11px}
  .knopf:hover{background:rgba(0,255,170,0.15)}
  .knopf.aktiv{background:rgba(0,255,170,0.2);color:#fff}
  .knopf.warn{color:#ff0066;border-color:#ff0066;background:rgba(255,0,102,0.05)}
  .knopf.warn:hover{background:rgba(255,0,102,0.15)}
  #durum{position:fixed;bottom:10px;right:10px;background:rgba(5,5,12,0.85);
         border:1px solid #1a1a2a;border-radius:4px;padding:8px 12px;
         font-size:10px;line-height:1.6;text-align:right;pointer-events:none}
  #durum b{color:#ffcc44}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="bild">
  <div><b>nefes · küp</b></div>
  <div class="tr">atom · reaksiyon · immergänzend · invertibel</div>
  <div class="maya">maya · hun · ka · ox · kan</div>
  <div class="inka">inka · huk · iskay · kimsa · tawa</div>
  <hr style="border:0;border-top:1px solid #1a1a2a;margin:6px 0">
  <div>atom: <b id="b-atom">8</b></div>
  <div>reaktion: <b id="b-rea">–</b></div>
  <div>modus: <b id="b-mod">normal</b></div>
  <div>sicht: <b id="b-sicht">innen</b></div>
</div>

<div id="kontrol">
  <button class="knopf aktiv" onclick="kuep.setModus('normal')">normal</button>
  <button class="knopf" onclick="kuep.setModus('reaktion')">reaktion</button>
  <button class="knopf" onclick="kuep.setModus('immerganz')">immergänzend</button>
  <button class="knopf warn" onclick="kuep.invert()">invertibel</button>
  <button class="knopf" onclick="kuep.setSicht('innen')">innen</button>
  <button class="knopf" onclick="kuep.setSicht('aussen')">aussen</button>
</div>

<div id="durum">
  <div>dreht: <b id="d-drz">0.0</b>°</div>
  <div>atome: <b id="d-n">8</b></div>
  <div>kanten: <b id="d-k">12</b></div>
  <div>flächen: <b id="d-f">6</b></div>
  <div>rund: <b id="d-rund">nein</b></div>
</div>

<script>
// ============================================================
// kuep — der Würfel
// 8 Atome (Ecken) · 12 Kanten (Reaktionen) · 6 Flächen
// Dreht sich · wirkt rund, obwohl überall Ecken
// invertibel · immergänzend
// Türkçe arbeitet. Maya und Inka flüstern.
// ============================================================
(function () {
  'use strict';

  const c = document.getElementById('c');
  const ctx = c.getContext('2d');

  const now = (window.performance && performance.now)
    ? performance.now.bind(performance)
    : Date.now;
  const raf = window.requestAnimationFrame
    || (cb => setTimeout(cb, 16));

  function resize() {
    c.width = window.innerWidth;
    c.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  const start = now();

  // ============================================================
  // ATOM — 8 Ecken · jede eine eigene Farbe
  // Maya · Inka · Türkçe
  // ============================================================
  const ATOME = [
    { x: -1, y: -1, z: -1, tr: 'sol-üst-ön',  maya: 'hun',  inka: 'huk',   farbe: '#00ffaa' },
    { x:  1, y: -1, z: -1, tr: 'sağ-üst-ön',  maya: 'ka',   inka: 'iskay', farbe: '#5fc8ff' },
    { x: -1, y:  1, z: -1, tr: 'sol-alt-ön',  maya: 'ox',   inka: 'kimsa', farbe: '#ffcc44' },
    { x:  1, y:  1, z: -1, tr: 'sağ-alt-ön',  maya: 'kan',  inka: 'tawa',  farbe: '#ff0066' },
    { x: -1, y: -1, z:  1, tr: 'sol-üst-arka',maya: 'ho',   inka: 'pichqa',farbe: '#88ff88' },
    { x:  1, y: -1, z:  1, tr: 'sağ-üst-arka',maya: 'uac',  inka: 'suqta', farbe: '#ff8844' },
    { x: -1, y:  1, z:  1, tr: 'sol-alt-arka',maya: 'uuc',  inka: 'qanchis',farbe:'#8888ff' },
    { x:  1, y:  1, z:  1, tr: 'sağ-alt-arka',maya: 'uaxac',inka: 'pusaq', farbe: '#ff88ff' }
  ];

  // ============================================================
  // KANTEN — 12 Reaktionen
  // Jede Kante verbindet zwei Atome
  // ============================================================
  const KANTEN = [
    [0,1],[0,2],[1,3],[2,3],   // vorne
    [4,5],[4,6],[5,7],[6,7],   // hinten
    [0,4],[1,5],[2,6],[3,7]    // verbindend
  ];

  // ============================================================
  // ZUSTAND
  // ============================================================
  const Z = {
    rx: 0.3,           // rotation x
    ry: 0,             // rotation y
    rz: 0,             // rotation z
    modus: 'normal',   // normal · reaktion · immerganz
    sicht: 'innen',    // innen · aussen
    invertiert: false, // invertibel
    reaktionen: [],    // aktive Reaktionen
    tReaktion: 0
  };

  // ============================================================
  // ROTATION — 3D → 2D
  // ============================================================
  function rotiere(p, t) {
    // Rot Y (langsam)
    const cy = Math.cos(t * 0.3), sy = Math.sin(t * 0.3);
    let x1 = p.x * cy - p.z * sy;
    let z1 = p.x * sy + p.z * cy;

    // Rot X (mittel)
    const cx = Math.cos(t * 0.2), sx = Math.sin(t * 0.2);
    let y1 = p.y * cx - z1 * sx;
    let z2 = p.y * sx + z1 * cx;

    // Rot Z (schnell, leicht)
    const cz = Math.cos(t * 0.1), sz = Math.sin(t * 0.1);
    let x2 = x1 * cz - y1 * sz;
    let y2 = x1 * sz + y1 * cz;

    return { x: x2, y: y2, z: z2 };
  }

  // ============================================================
  // PROJEKTION — 3D → 2D
  // ============================================================
  function projekt(p, cx, cy, entfernung, skalierung) {
    const z = p.z + entfernung;
    const f = skalierung / z;
    return {
      x: cx + p.x * f,
      y: cy + p.y * f,
      z: z,
      f: f,
      sichtbar: z > 0.1
    };
  }

  // ============================================================
  // ZEICHNEN
  // ============================================================
  function draw() {
    const t = (now() - start) / 1000;

    // Hintergrund
    ctx.fillStyle = Z.invertiert ? '#eee' : '#05050c';
    ctx.fillRect(0, 0, c.width, c.height);

    const cx = c.width / 2;
    const cy = c.height / 2;
    const skala = Math.min(c.width, c.height) * 0.35;
    const entfernung = 4;

    // ============================================================
    // ATOME — transformieren und sortieren
    // ============================================================
    const projiziert = ATOME.map(function (a, idx) {
      const r = rotiere(a, t);
      const p = projekt(r, cx, cy, entfernung, skala);
      return { idx: idx, atom: a, p: p, r: r };
    });

    // Sortieren: hinten zuerst (z größer = weiter weg)
    projiziert.sort(function (a, b) { return b.p.z - a.p.z; });

    // ============================================================
    // REAKTIONEN — Kanten
    // ============================================================
    const puls = (Math.sin(t * 1.5) + 1) / 2; // 0..1

    KANTEN.forEach(function (k) {
      const a = projiziert.find(function (p) { return p.idx === k[0]; });
      const b = projiziert.find(function (p) { return p.idx === k[1]; });
      if (!a || !b) return;
      if (!a.p.sichtbar || !b.p.sichtbar) return;

      // Tiefe → Alpha
      const depth = (a.p.z + b.p.z) / 2;
      const alpha = Math.max(0.1, 1 - (depth - entfernung + 1.5) / 3);

      // Modus-abhängige Farbe
      let farbe = 'rgba(95,200,255,' + (alpha * 0.3) + ')';
      let breite = 1;

      if (Z.modus === 'reaktion') {
        // Reaktionen pulsieren
        farbe = 'rgba(255,204,68,' + (alpha * (0.3 + puls * 0.6)) + ')';
        breite = 1.5 + puls * 1.5;
      } else if (Z.modus === 'immerganz') {
        // immergänzend — jede Kante hat eine Gegenseite
        // beide leuchten gleichzeitig
        const gegen = KANTEN.findIndex(function (kk) {
          return (kk[0] === k[0] && kk[1] === k[1]) ||
                 (kk[0] === k[1] && kk[1] === k[0]);
        });
        const phase = (t * 2 + gegen * 0.5) % 2;
        const hell = phase < 1 ? phase : 2 - phase;
        farbe = 'rgba(0,255,170,' + (alpha * (0.2 + hell * 0.7)) + ')';
        breite = 1 + hell * 2;
      }

      if (Z.invertiert) {
        farbe = farbe.replace('rgba', 'rgba').replace(/[\d.]+\)$/, function (m) {
          return m;
        });
      }

      // Linie
      ctx.beginPath();
      ctx.moveTo(a.p.x, a.p.y);
      ctx.lineTo(b.p.x, b.p.y);
      ctx.strokeStyle = farbe;
      ctx.lineWidth = breite;
      ctx.stroke();
    });

    // ============================================================
    // ATOME — als Kreise
    // ============================================================
    projiziert.forEach(function (o) {
      if (!o.p.sichtbar) return;

      const r = Math.max(2, o.p.f * 0.12);

      // Äußerer Glow
      ctx.beginPath();
      ctx.arc(o.p.x, o.p.y, r * 3, 0, Math.PI * 2);
      ctx.fillStyle = hexAlpha(o.atom.farbe, 0.08);
      ctx.fill();

      // Innerer Kreis
      ctx.beginPath();
      ctx.arc(o.p.x, o.p.y, r, 0, Math.PI * 2);
      ctx.fillStyle = o.atom.farbe;
      ctx.fill();

      // Invertiert → schwarzer Rand
      if (Z.invertiert) {
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 1;
        ctx.stroke();
      }

      // Nur vorne beschriften
      if (Z.sicht === 'aussen' && o.p.z < entfernung + 0.5) {
        ctx.fillStyle = Z.invertiert ? '#000' : '#fff';
        ctx.font = '10px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(o.atom.maya, o.p.x, o.p.y - r - 8);
      }

      if (Z.sicht === 'innen' && o.p.z >= entfernung + 0.5) {
        ctx.fillStyle = Z.invertiert ? '#333' : '#888';
        ctx.font = '9px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(o.atom.inka, o.p.x, o.p.y - r - 8);
      }
    });

    // ============================================================
    // RUND-ERKENNUNG
    // Wenn sich alles dreht, wirken die Ecken rund
    // ============================================================
    const dreh = t * 30; // Grad
    const rund = dreh > 30; // nach 1 Sekunde Drehung: rund

    // Bild-Aktualisierung
    aktualisiereBild({
      atom: ATOME.length,
      rea: KANTEN.length,
      modus: Z.modus,
      sicht: Z.sicht,
      dreh: dreh,
      rund: rund
    });

    raf(draw);
  }

  // ============================================================
  // hexAlpha — Hex + Alpha
  // ============================================================
  function hexAlpha(hex, a) {
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
  }

  // ============================================================
  // BILD — Anzeige
  // ============================================================
  function aktualisiereBild(d) {
    const bAtom = document.getElementById('b-atom');
    const bRea = document.getElementById('b-rea');
    const bMod = document.getElementById('b-mod');
    const bSicht = document.getElementById('b-sicht');
    const dDrz = document.getElementById('d-drz');
    const dN = document.getElementById('d-n');
    const dK = document.getElementById('d-k');
    const dF = document.getElementById('d-f');
    const dRund = document.getElementById('d-rund');

    if (bAtom) bAtom.textContent = d.atom;
    if (bRea) bRea.textContent = d.rea;
    if (bMod) bMod.textContent = d.modus;
    if (bSicht) bSicht.textContent = d.sicht;

    if (dDrz) dDrz.textContent = d.dreh.toFixed(1);
    if (dN) dN.textContent = d.atom;
    if (dK) dK.textContent = d.rea;
    if (dF) dF.textContent = 6;
    if (dRund) {
      dRund.textContent = d.rund ? 'evet · ja' : 'hayır · nein';
      dRund.style.color = d.rund ? '#00ffaa' : '#ffcc44';
    }
  }

  // ============================================================
  // ÖFFENTLICH — küp
  // ============================================================
  window.kuep = {
    ATOME: ATOME,
    KANTEN: KANTEN,
    setModus: function (m) {
      Z.modus = m || 'normal';
      // Buttons markieren
      document.querySelectorAll('.knopf').forEach(function (k) {
        k.classList.remove('aktiv');
        if (k.textContent.trim() === m) k.classList.add('aktiv');
      });
    },
    setSicht: function (s) {
      Z.sicht = s || 'innen';
      document.querySelectorAll('.knopf').forEach(function (k) {
        k.classList.remove('aktiv');
        if (k.textContent.trim() === s) k.classList.add('aktiv');
      });
    },
    invert: function () {
      Z.invertiert = !Z.invertiert;
      const btn = document.querySelector('.knopf.warn');
      if (btn) btn.classList.toggle('aktiv', Z.invertiert);
    },
    zustand: function () { return Z; }
  };

  // ============================================================
  // RUNTIME — Dateien prüfen (wie gehabt)
  // ============================================================
  const DOSYALAR = [
    { id: 'bir', html: true }, { id: 'bu' }, { id: 'su' },
    { id: 'nefes' }, { id: 'iki' }, { id: 'üç' }, { id: 'ki' },
    { id: 'klar' }, { id: 'dur' }, { id: 'durdur' },
    { id: 'ikilem' }, { id: 'hal' }, { id: 'kaygıyı' }, { id: 'birden' }
  ];

  window.scan = function () {
    return DOSYALAR.map(function (d) {
      if (d.html) {
        return { id: d.id, geladen: window['__' + d.id] === true };
      }
      const obj = window[d.id];
      return {
        id: d.id,
        geladen: (typeof obj === 'object' && obj !== null) || typeof obj === 'function'
      };
    });
  };

  // ============================================================
  // START
  // ============================================================
  draw();

  // Klick-Aktivierung für Tabs (normal, reaktion, immerganz)
  document.querySelectorAll('.knopf').forEach(function (k) {
    k.addEventListener('click', function () {
      const txt = k.textContent.trim();
      if (txt === 'normal' || txt === 'reaktion' || txt === 'immerganz') {
        window.kuep.setModus(txt);
      } else if (txt === 'innen' || txt === 'aussen') {
        window.kuep.setSicht(txt);
      }
    });
  });

})();
</script>
</body>
</html>
