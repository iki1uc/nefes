<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>tmp · id test · verwickeln</title>
<style>
  body{background:#0a0a14;color:#eee;font-family:sans-serif;padding:20px}
  #steuer{margin-bottom:20px}
  button{background:#1a3a2a;color:#00ffaa;border:1px solid #00ffaa;
         padding:8px 14px;margin:4px;border-radius:4px;cursor:pointer;
         font-family:monospace}
  button:hover{background:#00ffaa;color:#0a0a14}
  #log{font-family:monospace;font-size:12px;color:#5fc8ff;
       background:rgba(0,255,170,.05);padding:10px;border-radius:4px;
       margin-top:16px;max-height:200px;overflow:auto}
  iframe{border:1px solid #1a3a2a;border-radius:8px;
         width:600px;height:800px;background:#0a0a14}
</style>
</head>
<body>

<h1 style="color:#ffcc44;font-size:16px">tmp · verwickeln test</h1>

<div id="steuer">
  <button onclick="yukle('sorge')">+ sorge</button>
  <button onclick="yukle('ikilem')">+ ikilem</button>
  <button onclick="yukle('hal')">+ hal</button>
  <button onclick="yukle('uc')">+ üç</button>
  <button onclick="yukle('klar')">+ klar</button>
  <button onclick="yukle('dur')">+ dur</button>
  <button onclick="yukle('iki')">+ iki</button>
  <button onclick="sifirla()" style="color:#ff0066;border-color:#ff0066">sıfırla</button>
</div>

<iframe id="cerceve" src="ID.html"></iframe>

<div id="log">log · warte…</div>

<script>
const LOG = document.getElementById('log');
function yaz(s){
  LOG.textContent = new Date().toLocaleTimeString() + ' · ' + s + '\n' + LOG.textContent;
}

// Zugriff auf das iframe-Fenster — dort lebt ID.html
function pencere(){
  return document.getElementById('cerceve').contentWindow;
}

// Simuliert das Laden einer Geschwister-Datei
function yukle(ad){
  const w = pencere();
  if (!w) return;

  // Objektname auf window legen (genau das, was deine ID.html prüft)
  const isim = (ad === 'uc') ? 'üç' : ad;
  w[isim] = { ad: isim, yuklendi: new Date().toISOString() };

  yaz('yüklendi: window.' + isim);

  // WICHTIG: Verwickeln — Marker sofort aufrufen und reagieren lassen
  if (w.id && typeof w.id.marker === 'function') {
    w.id.marker(function(m){
      yaz('  ↳ ReCALL: ' + m.anzahl + '/7 parça · maya ' + m.maya + ' · inka ' + m.inka);
      if (m.bereit) {
        yaz('  ↳ marker bereit · ' + m.hinweis);
      }
    });
    // Anzeige im iframe aktualisieren
    w.id.bild();
    w.id.anzeige();
  }
}

function sifirla(){
  const w = pencere();
  ['sorge','ikilem','hal','üç','klar','dur','iki'].forEach(k => {
    try { delete w[k]; } catch(e) { w[k] = undefined; }
  });
  LOG.textContent = 'sıfırlandı ·\n';
  if (w.id) { w.id.bild(); w.id.anzeige(); }
}

// Beim Start: iframe bereit?
document.getElementById('cerceve').addEventListener('load', function(){
  yaz('ID.html yüklendi · hazır');
});
</script>
</body>
</html>
