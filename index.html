<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>nefes · küp · çalışan</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#05050c;color:#eee;
            font-family:monospace;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh;position:fixed;inset:0;z-index:0}

  #ui{position:fixed;inset:0;z-index:10;pointer-events:none}
  #ui > *{pointer-events:auto}

  #menu{
    position:fixed;top:20px;left:20px;width:260px;
    background:rgba(5,5,12,0.88);border:1px solid #1a3a2a;
    border-radius:6px;padding:14px;backdrop-filter:blur(4px);
    max-height:calc(100vh - 40px);overflow-y:auto
  }
  #menu h2{color:#ffcc44;font-size:14px;margin:0 0 2px;
           font-weight:normal;letter-spacing:2px}
  #menu .hauch{color:#5fc8ff;font-size:10px;margin-bottom:12px}
  #menu .hauch .maya{color:#00ffaa}
  #menu .hauch .inka{color:#ff0066}

  .eintrag{
    display:block;padding:10px 12px;margin:4px 0;
    background:rgba(255,255,255,0.02);border:1px solid #1a1a2a;
    border-left:3px solid #1a1a2a;border-radius:0 4px 4px 0;
    cursor:pointer;transition:all .2s;color:#eee;font-size:12px
  }
  .eintrag:hover{border-left-color:#00ffaa;
                 background:rgba(0,255,170,0.04);padding-left:16px}
  .eintrag.aktiv{border-left-color:#ffcc44;
                 background:rgba(255,204,68,0.06)}
  .eintrag .name{color:#ffcc44;font-weight:bold;letter-spacing:1px}
  .eintrag .was{color:#888;font-size:10px;margin-top:2px}

  #panel{
    position:fixed;top:20px;right:20px;width:320px;
    background:rgba(5,5,12,0.9);border:1px solid #1a3a2a;
    border-radius:6px;padding:16px;backdrop-filter:blur(4px);
    max-height:calc(100vh - 40px);overflow-y:auto;display:none
  }
  #panel.aktiv{display:block}
  #panel h3{color:#ffcc44;font-size:13px;margin:0 0 4px;
            font-weight:normal;letter-spacing:1px}
  #panel .hauch{color:#5fc8ff;font-size:10px;margin-bottom:14px}
  #panel .hauch .maya{color:#00ffaa}
  #panel .hauch .inka{color:#ff0066}

  .feld{margin:10px 0}
  .feld label{display:block;color:#5fc8ff;font-size:10px;
              margin-bottom:4px;letter-spacing:1px}
  .feld input{
    width:100%;padding:8px;background:#05050c;color:#eee;
    border:1px solid #1a1a2a;border-radius:4px;
    font-family:monospace;font-size:13px
  }
  .feld input:focus{outline:none;border-color:#00ffaa}

  .knopf{
    margin-top:10px;padding:9px 16px;background:rgba(0,255,170,0.05);
    color:#00ffaa;border:1px solid #00ffaa;border-radius:4px;
    cursor:pointer;font-family:monospace;font-size:12px;
    letter-spacing:1px;transition:all .2s
  }
  .knopf:hover{background:rgba(0,255,170,0.15)}
  .knopf.warn{color:#ff0066;border-color:#ff0066;
              background:rgba(255,0,102,0.05)}
  .knopf.warn:hover{background:rgba(255,0,102,0.15)}

  .ergebnis{
    margin-top:12px;padding:12px;background:rgba(0,255,170,0.03);
    border-left:3px solid #00ffaa;border-radius:0 4px 4px 0;
    font-size:12px;line-height:1.7;white-space:pre-wrap;
    color:#7ce0a8
  }
  .ergebnis .tr{color:#ffcc44}
  .ergebnis .maya{color:#00ffaa}
  .ergebnis .inka{color:#ff0066}
  .ergebnis .dim{color:#666}

  #status{
    position:fixed;bottom:20px;left:20px;
    padding:8px 14px;background:rgba(5,5,12,0.85);
    border:1px solid #1a1a2a;border-radius:4px;
    font-size:10px;line-height:1.6;color:#666
  }
  #status b{color:#ffcc44}
  #status .ok{color:#00ffaa}
  #status .no{color:#ff0066}
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="menu">
  <h2>nefes</h2>
  <div class="hauch">
    <span class="maya">maya · ik'</span> ·
    <span class="inka">inka · samay</span> · türkçe
  </div>

  <div class="eintrag" data-p="nefes">
    <div class="name">nefes</div>
    <div class="was">Atem · pulsierender Rhythmus</div>
  </div>
  <div class="eintrag" data-p="sayi">
    <div class="name">sayı</div>
    <div class="was">Zahl 1–21 · Bedeutung</div>
  </div>
  <div class="eintrag" data-p="sor">
    <div class="name">sor</div>
    <div class="was">Frage · 4 Schichten</div>
  </div>
  <div class="eintrag" data-p="dur">
    <div class="name">dur</div>
    <div class="was">Stop · küp durdur</div>
  </div>
  <div class="eintrag" data-p="durum">
    <div class="name">durum</div>
    <div class="was">Zustand · Status</div>
  </div>
</div>

<div id="panel"></div>

<div id="status">
  küp: <b id="st-k" class="ok">dönüyor</b> ·
  nefes: <b id="st-n">–</b> ·
  panel: <b id="st-p">kapalı</b>
</div>

<script>
(function(){
'use strict';

// ============================================================
// KÜP — sichtbar, dreht sich, im Zentrum
// ============================================================
const c = document.getElementById('c');
const ctx = c.getContext('2d');

function resize(){
  c.width = window.innerWidth;
  c.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

const ATOME = [
  {x:-1,y:-1,z:-1},{x:1,y:-1,z:-1},
  {x:-1,y:1,z:-1},{x:1,y:1,z:-1},
  {x:-1,y:-1,z:1},{x:1,y:-1,z:1},
  {x:-1,y:1,z:1},{x:1,y:1,z:1}
];
const KANTEN = [
  [0,1],[0,2],[1,3],[2,3],
  [4,5],[4,6],[5,7],[6,7],
  [0,4],[1,5],[2,6],[3,7]
];

function rotiere(p, t){
  const cy = Math.cos(t*0.2), sy = Math.sin(t*0.2);
  let x1 = p.x*cy - p.z*sy;
  let z1 = p.x*sy + p.z*cy;
  const cx = Math.cos(t*0.15), sx = Math.sin(t*0.15);
  let y1 = p.y*cx - z1*sx;
  let z2 = p.y*sx + z1*cx;
  return {x:x1, y:y1, z:z2};
}

function proj(p, cx, cy, skala){
  const e = 5;
  const z = p.z + e;
  const f = skala / z;
  return {x: cx + p.x*f, y: cy + p.y*f, z: z, f: f};
}

let dreht = true;
let t0 = 0;
let atemPhase = 0;

const now = performance.now.bind(performance);
const raf = requestAnimationFrame.bind(window);
let letzteZeit = now();

function draw(){
  const jetzt = now();
  const dt = (jetzt - letzteZeit) / 1000;
  letzteZeit = jetzt;

  if(dreht) t0 += dt;
  atemPhase += dt;

  // Atem: 0..1, Periode 8s (4s ein, 4s aus)
  const atem = (Math.sin(atemPhase * Math.PI / 4) + 1) / 2;

  ctx.fillStyle = '#05050c';
  ctx.fillRect(0, 0, c.width, c.height);

  const cx = c.width / 2;
  const cy = c.height / 2;
  const skala = Math.min(c.width, c.height) * 0.22
              * (0.9 + 0.15 * atem);

  const projiziert = ATOME.map(function(a){
    return proj(rotiere(a, t0), cx, cy, skala);
  });

  KANTEN.forEach(function(k){
    const a = projiziert[k[0]];
    const b = projiziert[k[1]];
    const alpha = Math.max(0.08, 1 - (a.z + b.z - 10) / 6);
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.strokeStyle = 'rgba(0,255,170,' + (alpha*0.3) + ')';
    ctx.lineWidth = 1;
    ctx.stroke();
  });

  projiziert.forEach(function(p){
    const r = Math.max(1.5, p.f * 0.07 * (0.8 + 0.4*atem));
    ctx.beginPath();
    ctx.arc(p.x, p.y, r, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(0,255,170,' + (0.35 + 0.25*atem) + ')';
    ctx.fill();
  });

  // Status
  document.getElementById('st-n').textContent = atem.toFixed(2);

  raf(draw);
}

draw();

// ============================================================
// MENÜ + PANELS
// ============================================================
const panel = document.getElementById('panel');
const statusPanel = document.getElementById('st-p');

const inhalte = {
  nefes: {
    titel: 'nefes · Atem',
    hauch: 'maya · ik\' · inka · samay',
    html: '<div class="ergebnis" id="nefes-out">–</div>' +
          '<button class="knopf" onclick="window.nefesZeig()">nefes · zeig</button>'
  },
  sayi: {
    titel: 'sayı · Zahl',
    hauch: 'maya · hun · inka · huk',
    html: '<div class="feld"><label>sayı · Zahl (1–21)</label>' +
          '<input id="sayi-n" type="number" min="1" max="21" value="7"></div>' +
          '<button class="knopf" onclick="window.sayiZeig()">zeig</button>' +
          '<div class="ergebnis" id="sayi-out"></div>'
  },
  sor: {
    titel: 'sor · Frage',
    hauch: 'maya · ik\' · inka · samay',
    html: '<div class="feld"><label>soru · Frage</label>' +
          '<input id="sor-x" placeholder="was ist?"></div>' +
          '<button class="knopf" onclick="window.sorZeig()">sor</button>' +
          '<div class="ergebnis" id="sor-out"></div>'
  },
  dur: {
    titel: 'dur · Stop',
    hauch: 'maya · hun · inka · huk',
    html: '<div class="ergebnis" id="dur-out">küp dönüyor</div>' +
          '<button class="knopf warn" onclick="window.durToggle()">dur / devam</button>'
  },
  durum: {
    titel: 'durum · Zustand',
    hauch: 'maya · ik\' · inka · samay',
    html: '<div class="ergebnis" id="durum-out">–</div>'
  }
};

function oeffnePanel(id){
  const e = inhalte[id];
  if(!e) return;
  panel.innerHTML =
    '<h3>' + e.titel + '</h3>' +
    '<div class="hauch">' + e.hauch + '</div>' +
    e.html;
  panel.classList.add('aktiv');
  statusPanel.textContent = id;

  if(id === 'durum') window.durumZeig();
  if(id === 'nefes') window.nefesZeig();
}

document.querySelectorAll('.eintrag').forEach(function(el){
  el.addEventListener('click', function(){
    document.querySelectorAll('.eintrag').forEach(function(x){
      x.classList.remove('aktiv');
    });
    el.classList.add('aktiv');
    oeffnePanel(el.getAttribute('data-p'));
  });
});

// ============================================================
// AKTIONEN
// ============================================================

// nefes — zeigt aktuellen Atemwert + Anleitung
window.nefesZeig = function(){
  const out = document.getElementById('nefes-out');
  if(!out) return;
  out.innerHTML =
    '<span class="tr">4 saniye al · 4 saniye ver</span>\n\n' +
    'einatmen · al\n' +
    'tut · tut\n' +
    'ver · ver\n\n' +
    '<span class="dim">küp nefesle büyür ve küçülür.</span>';
};

// sayi — 1..21, Bedeutung
const BEDEUTUNG = {
  1:'başlangıç · Anfang',
  2:'denge · Gleichgewicht',
  3:'üçlü · Dreiheit',
  4:'dört yön · vier Richtungen',
  5:'beş element · fünf Elemente',
  6:'altı yüz · sechs Flächen',
  7:'yedi nefes · sieben Atem',
  8:'sekiz köşe · acht Ecken',
  9:'dokuz · neun',
  10:'on · zehn',
  11:'on bir · elf',
  12:'on iki kenar · zwölf Kanten',
  13:'on üç · dreizehn',
  14:'on dört · vierzehn',
  15:'on beş · fünfzehn',
  16:'on altı · sechzehn',
  17:'on yedi · siebzehn',
  18:'on sekiz · achtzehn',
  19:'on dokuz · neunzehn',
  20:'yirmi · zwanzig',
  21:'yirmi bir · einundzwanzig · tam · voll'
};

window.sayiZeig = function(){
  const n = parseInt(document.getElementById('sayi-n').value, 10) || 1;
  const nn = Math.max(1, Math.min(21, n));
  const b = BEDEUTUNG[nn] || '–';
  document.getElementById('sayi-out').innerHTML =
    '<span class="tr">sayı:</span> ' + nn + '\n' +
    '<span class="maya">anlam:</span> ' + b + '\n\n' +
    '<span class="dim">1 → 3 → 9 → 21 · atom → cluster → kubbe</span>';
};

// sor — 4 Schichten
window.sorZeig = function(){
  const x = (document.getElementById('sor-x').value || 'bilinmiyor').trim();
  const out = document.getElementById('sor-out');
  out.innerHTML =
    '<span class="tr">was:</span> ' + x + '\n\n' +
    '<span class="maya">mana:</span> içeride kalır · bleibt innen\n' +
    '<span class="inka">aura:</span> dışarı yayılır · strahlt aus\n' +
    '<span class="tr">yankı:</span> geri döner · kehrt zurück\n' +
    '<span class="tr">alan:</span> taşır · trägt\n\n' +
    '<span class="dim">zen: sus. dinle. kal.</span>';
};

// dur — toggle
window.durToggle = function(){
  dreht = !dreht;
  const out = document.getElementById('dur-out');
  const st = document.getElementById('st-k');
  if(out) out.textContent = dreht ? 'küp dönüyor' : 'küp durdu';
  if(st){
    st.textContent = dreht ? 'dönüyor' : 'durdu';
    st.className = dreht ? 'ok' : 'no';
  }
};

// durum
window.durumZeig = function(){
  const out = document.getElementById('durum-out');
  if(!out) return;
  out.innerHTML =
    '<span class="tr">küp:</span> ' +
      (dreht ? 'dönüyor' : 'durdu') + '\n' +
    '<span class="tr">nefes:</span> 4s al · 4s ver\n' +
    '<span class="tr">panel:</span> ' + statusPanel.textContent + '\n' +
    '<span class="tr">dosya:</span> self-contained\n\n' +
    '<span class="maya">maya · ik\'</span> · ' +
    '<span class="inka">inka · samay</span>';
};

// ============================================================
// Tastatur: ESC schließt Panel
// ============================================================
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape'){
    panel.classList.remove('aktiv');
    document.querySelectorAll('.eintrag').forEach(function(x){
      x.classList.remove('aktiv');
    });
    statusPanel.textContent = 'kapalı';
  }
});

})();
</script>
</body>
</html>
