<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>nefes · index</title>
<style>
  :root { --bg:#0a0a0f; --fg:#e8e8f0; --dim:#6a6a7a; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh;
    font-family: ui-monospace, Menlo, monospace;
    background: var(--bg); color: var(--fg);
    display: flex; flex-direction: column;
    transition: background .8s;
  }
  header {
    padding: 1rem; display: flex; justify-content: space-between;
    align-items: baseline; border-bottom: 1px solid #1a1a25;
  }
  header h1 { margin: 0; font-size: 1.1rem; font-weight: 500; letter-spacing: .1em; }
  header .meta { color: var(--dim); font-size: .75rem; }

  #bühne {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 1.5rem 1rem; gap: 1.5rem;
  }

  #spieler {
    display: grid; grid-template-columns: repeat(2, 1fr);
    gap: 1rem; width: min(100%, 24rem);
  }
  .slot {
    aspect-ratio: 1; border-radius: 1rem;
    background: #12121a; border: 2px solid #1a1a25;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 1rem; text-align: center; cursor: pointer;
    transition: all .3s;
  }
  .slot.aktiv { border-color: currentColor; }
  .slot .name { font-size: .7rem; color: var(--dim); letter-spacing: .1em; text-transform: uppercase; }
  .slot .wert { font-size: 2rem; margin: .25rem 0; font-weight: 300; }
  .slot .methode { font-size: .65rem; color: var(--dim); }
  .slot.leer { opacity: .45; }

  #nenner {
    text-align: center; padding: 1rem 0;
    border-top: 1px solid #1a1a25; border-bottom: 1px solid #1a1a25;
    width: 100%;
  }
  #nenner .label { font-size: .7rem; color: var(--dim); letter-spacing: .15em; text-transform: uppercase; }
  #nenner .zahl { font-size: 3rem; font-weight: 200; margin: .25rem 0; }
  #nenner .eins { font-size: .85rem; color: var(--dim); }

  #protokoll {
    padding: .75rem 1rem; font-size: .75rem; color: var(--dim);
    min-height: 4rem; max-height: 8rem; overflow-y: auto;
  }
  #protokoll div { padding: .15rem 0; }

  #regler { display: flex; gap: .5rem; padding: 1rem; }
  #regler button {
    flex: 1; padding: .75rem; border: 1px solid #1a1a25;
    background: #12121a; color: var(--fg);
    border-radius: .5rem; font-family: inherit; font-size: .8rem;
    cursor: pointer;
  }
  #regler button:active { background: #1a1a25; }
</style>
</head>
<body>

<header>
  <h1>nefes · index</h1>
  <span class="meta" id="uhr">—</span>
</header>

<main id="bühne">
  <div id="spieler"></div>

  <div id="nenner">
    <div class="label">gemeinsamer nenner</div>
    <div class="zahl" id="nenner-zahl">—</div>
    <div class="eins" id="nenner-eins">warte auf spieler</div>
  </div>
</main>

<div id="protokoll"></div>

<div id="regler">
  <button onclick="würfle()">würfle</button>
  <button onclick="zurücksetzen()">reset</button>
</div>

<script>
// ============================================================
// 1. DAS WISSEN — index kennt alle dateien
// ============================================================
const WISSEN = {
  "bir.html":     "der punkt · atmet",
  "birden.js":    "sequenz · 3 schritte",
  "iki.js":       "gegenstück · hinterband",
  "uc.js":        "raum · beziehung",
  "ki.js":        "klärung · kombination",
  "klar.js":      "klärung · drei sprachen",
  "dur.js":       "halt · ursache→wirkung",
  "ikilem.js":    "dilemma · löst auf",
  "id.html":      "marker · wer, wo, warum",
  "3.html":       "bühne · lädt uc",
  "nefes.js":     "atem · fluss",
  "wetter.html":  "beobachtung",
  "wind.html":    "bewegung · luft",
  "foto.js":      "licht · bild",
  "echo.html":    "antwort · widerhall",
  "erwachen.js":  "beginn",
  "uyan.js":      "aufwachen",
  "213.html":     "das neue · sim salabim",
  "run.js":       "lauf",
  "su.js":        "wasser",
  "sor.js":       "frage",
  "sunar.md":     "darbietung",
  "kaygıyı.js":   "sorge",
  "laune.js":     "stimmung",
  "colleckt.js":  "sammlung",
  "foto.js":      "licht",
};

// ============================================================
// 2. DIE METHODEN — jeder spieler wählt seine art
// ============================================================
// Der Nenner ist das, was jeden Spieler ausmacht.
// Er kommt aus seiner Methode.
// Mathematik: kgV der Nenner = gemeinsamer Nenner.
const METHODEN = [
  { name: "schach",  farbe: "#3a5a9a", zahl: 2, beschreibung: "denken" },
  { name: "soccer",  farbe: "#3a9a4a", zahl: 3, beschreibung: "bewegung" },
  { name: "wetter",  farbe: "#9a9a3a", zahl: 4, beschreibung: "beobachtung" },
  { name: "eigenes", farbe: "#9a3a9a", zahl: 5, beschreibung: "freiheit" },
];

let spieler = [
  { id: "p1", methode: null, zähler: 0, aktiv: false },
  { id: "p2", methode: null, zähler: 0, aktiv: false },
  { id: "p3", methode: null, zähler: 0, aktiv: false },
  { id: "p4", methode: null, zähler: 0, aktiv: false },
];

// ============================================================
// 3. MATHEMATIK — der gemeinsame nenner
// ============================================================
function ggT(a, b) { while (b) { [a, b] = [b, a % b]; } return a; }
function kgV(a, b) { return a * b / ggT(a, b); }

function gemeinsamerNenner() {
  const aktive = spieler.filter(s => s.aktiv);
  if (aktive.length === 0) return null;
  return aktive.reduce((acc, s) => kgV(acc, s.methode.zahl), 1);
}

function aufNenner(zähler, vonNenner, aufNenner) {
  return zähler * (aufNenner / vonNenner);
}

// ============================================================
// 4. DARSTELLUNG
// ============================================================
function zeichne() {
  const box = document.getElementById("spieler");
  box.innerHTML = "";
  spieler.forEach((s, i) => {
    const el = document.createElement("div");
    el.className = "slot" + (s.aktiv ? " aktiv" : " leer");
    el.style.color = s.methode ? s.methode.farbe : "#6a6a7a";

    if (s.aktiv) {
      el.innerHTML = `
        <div class="name">${s.methode.name}</div>
        <div class="wert" style="color:${s.methode.farbe}">${s.zähler}/${s.methode.zahl}</div>
        <div class="methode">${s.methode.beschreibung}</div>`;
    } else {
      el.innerHTML = `
        <div class="name">slot ${i+1}</div>
        <div class="wert">—</div>
        <div class="methode">tap für methode</div>`;
    }

    el.onclick = () => {
      if (!s.aktiv) {
        const benutzt = new Set(spieler.filter(x => x.aktiv).map(x => x.methode.name));
        const frei = METHODEN.find(m => !benutzt.has(m.name));
        if (frei) {
          s.methode = frei;
          s.zähler = Math.floor(Math.random() * frei.zahl) + 1;
          s.aktiv = true;
          protokoll(`${s.id} wählt ${frei.name} → ${s.zähler}/${frei.zahl}`);
        }
      } else {
        s.zähler = (s.zähler % s.methode.zahl) + 1;
        protokoll(`${s.id} → ${s.zähler}/${s.methode.zahl}`);
      }
      zeichne(); berechne();
    };
    box.appendChild(el);
  });
}

function berechne() {
  const aktive = spieler.filter(s => s.aktiv);
  const n = gemeinsamerNenner();
  const zahlEl = document.getElementById("nenner-zahl");
  const einsEl = document.getElementById("nenner-eins");

  if (n === null) {
    zahlEl.textContent = "—";
    einsEl.textContent = "warte auf spieler";
    return;
  }
  const summe = aktive.reduce((acc, s) => acc + aufNenner(s.zähler, s.methode.zahl, n), 0);
  zahlEl.textContent = n;
  const namen = aktive.map(s => s.methode.name).join(" + ");
  einsEl.textContent = `${summe}/${n} · ${namen}`;

  const rgb = aktive.map(s => hexZuRgb(s.methode.farbe));
  const avg = rgb.reduce((a, c) => [a[0]+c[0], a[1]+c[1], a[2]+c[2]], [0,0,0])
                 .map(v => Math.round(v / rgb.length));
  document.body.style.background =
    `rgb(${Math.round(avg[0]*0.18)},${Math.round(avg[1]*0.18)},${Math.round(avg[2]*0.18)})`;
}

function protokoll(text) {
  const p = document.getElementById("protokoll");
  const d = document.createElement("div");
  d.textContent = `› ${text}`;
  p.appendChild(d);
  p.scrollTop = p.scrollHeight;
}

function hexZuRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return [(n>>16)&255, (n>>8)&255, n&255];
}

function würfle() {
  spieler.filter(s => s.aktiv).forEach(s => {
    s.zähler = Math.floor(Math.random() * s.methode.zahl) + 1;
  });
  protokoll("würfel gefallen");
  zeichne(); berechne();
}

function zurücksetzen() {
  spieler = spieler.map(s => ({ ...s, methode: null, zähler: 0, aktiv: false }));
  document.getElementById("protokoll").innerHTML = "";
  document.body.style.background = "";
  protokoll("zurückgesetzt");
  zeichne(); berechne();
}

// ============================================================
// 5. START
// ============================================================
function tick() {
  document.getElementById("uhr").textContent = new Date().toTimeString().slice(0,8);
}
setInterval(tick, 1000); tick();

zeichne(); berechne();
protokoll("index kennt " + Object.keys(WISSEN).length + " dateien");
protokoll("wähle 3 oder 4 methoden");
</script>
</body>
</html>
