<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>nefes · runtime</title>
<style>
  html,body{margin:0;height:100%;background:#0a0a14;color:#eee;
            font-family:monospace;overflow:auto}
  #runtime{max-width:720px;margin:0 auto;padding:24px 16px}
  h1{color:#ffcc44;font-size:18px;margin:0 0 4px;letter-spacing:1px}
  .hauch{color:#5fc8ff;font-size:11px;margin-bottom:20px}
  .hauch .maya{color:#00ffaa}
  .hauch .inka{color:#ff0066}
  canvas{display:block;margin:16px auto;background:#0a0a14;border-radius:50%}
  table{width:100%;border-collapse:collapse;font-size:12px;margin:12px 0}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid #1a1a2a}
  th{color:#ffcc44;font-weight:normal;font-size:11px}
  .ok{color:#00ffaa}
  .no{color:#ff0066}
  .js{color:#5fc8ff}
  .tr{color:#ffcc44}
  .maya{color:#00ffaa;font-size:10px}
  .inka{color:#ff0066;font-size:10px}
  #durum{position:fixed;bottom:10px;right:10px;
         background:rgba(10,10,20,0.85);border:1px solid #1a1a2a;
         border-radius:4px;padding:8px 12px;font-size:11px;
         line-height:1.6;text-align:right}
  #durum b{color:#ffcc44}
  .fuss{color:#444;font-size:10px;text-align:center;margin-top:32px}
</style>
</head>
<body>

<div id="runtime">
  <h1>nefes · runtime</h1>
  <div class="hauch">
    <span class="maya">maya · ik'</span> ·
    <span class="inka">inka · samay</span> ·
    türkçe · nefes
  </div>

  <canvas id="cm" width="200" height="200"></canvas>

  <table id="liste">
    <thead>
      <tr>
        <th>dosya</th>
        <th>türkçe</th>
        <th>maya</th>
        <th>inka</th>
        <th>durum</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

  <div class="fuss">
    runtime · tarayıcı tarar · işaret gösterir · oyun değil
  </div>
</div>

<div id="durum">
  <div>yüklü: <b id="d-y">0</b> / <b id="d-t">0</b></div>
  <div>maya: <b id="d-maya">ma'</b></div>
  <div>inka: <b id="d-inka">mana</b></div>
  <div>t: <b id="d-t-t">0.0</b> s</div>
</div>

<!-- ============================================================
     RUNTIME — lädt alle Dateien, prüft, zeigt Wahrheit
     ============================================================ -->

<!-- Kern -->
<script src="bir.html" onerror="window.__bir=false"></script>
<script src="bu.js" onerror="window.__bu=false"></script>
<script src="su.js" onerror="window.__su=false"></script>
<script src="nefes.js" onerror="window.__nefes=false"></script>

<!-- Anhängsel -->
<script src="iki.js"></script>
<script src="uc.js"></script>
<script src="ki.js"></script>
<script src="klar.js"></script>
<script src="dur.js"></script>
<script src="durdur.js"></script>
<script src="ikilem.js"></script>
<script src="hal.js"></script>
<script src="kaygıyı.js"></script>
<script src="birden.js"></script>

<script>
// ============================================================
// runtime — die Wahrheit über den Zustand
// Türkçe arbeitet. Maya und Inka flüstern.
// ============================================================
(function () {
  'use strict';

  // Fallbacks
  const now = (window.performance && performance.now)
    ? performance.now.bind(performance)
    : Date.now;
  const start = now();

  // ------------------------------------------------------------
  // DOSYALAR — was gibt es, was erwarten wir?
  // ------------------------------------------------------------
  const DOSYALAR = [
    { id: 'bir',     tr: 'bir',     maya: 'hun',  inka: 'huk',    datei: 'bir.html'     },
    { id: 'bu',      tr: 'bu',      maya: 'hun',  inka: 'huk',    datei: 'bu.js'        },
    { id: 'su',      tr: 'şu',      maya: 'ka',   inka: 'iskay',  datei: 'su.js'        },
    { id: 'nefes',   tr: 'nefes',   maya: 'ik\'', inka: 'samay',  datei: 'nefes.js'     },
    { id: 'iki',     tr: 'iki',     maya: 'ka',   inka: 'iskay',  datei: 'iki.js'       },
    { id: 'üç',      tr: 'üç',      maya: 'ox',   inka: 'kimsa',  datei: 'uc.js'        },
    { id: 'ki',      tr: 'ki',      maya: 'hun',  inka: 'huk',    datei: 'ki.js'        },
    { id: 'klar',    tr: 'klar',    maya: 'ma\'', inka: 'mana',   datei: 'klar.js'      },
    { id: 'dur',     tr: 'dur',     maya: 'kan',  inka: 'sayay',  datei: 'dur.js'       },
    { id: 'durdur',  tr: 'durdur',  maya: 'kan',  inka: 'sayay',  datei: 'durdur.js'    },
    { id: 'ikilem',  tr: 'ikilem',  maya: 'kan',  inka: 'tawa',   datei: 'ikilem.js'    },
    { id: 'hal',     tr: 'hal',     maya: 'u hal', inka: 'kawsay', datei: 'hal.js'      },
    { id: 'kaygıyı', tr: 'kaygıyı', maya: 'kan',  inka: 'tawa',   datei: 'kaygıyı.js'   },
    { id: 'birden',  tr: 'birden',  maya: 'ka',   inka: 'iskay',  datei: 'birden.js'    }
  ];

  // ------------------------------------------------------------
  // BAK — ist geladen?
  // ------------------------------------------------------------
  function bak(d) {
    let geladen = false;
    let obj = null;

    // Spezialfall: bir.html ist HTML, kein JS-Objekt
    if (d.id === 'bir') {
      geladen = typeof window.bir !== 'undefined' || window.__bir === false;
      obj = window.bir || null;
    } else {
      obj = window[d.id] || null;
      geladen = typeof obj === 'object' || typeof obj === 'function';
    }

    return {
      id: d.id,
      tr: d.tr,
      maya: d.maya,
      inka: d.inka,
      datei: d.datei,
      geladen: geladen,
      obj: obj
    };
  }

  // ------------------------------------------------------------
  // HEP — alle prüfen
  // ------------------------------------------------------------
  function hep() {
    return DOSYALAR.map(bak);
  }

  // ------------------------------------------------------------
  // YAZ — die Tabelle füllen
  // ------------------------------------------------------------
  function yaz() {
    const tb = document.getElementById('tbody');
    if (!tb) return;
    const liste = hep();

    tb.innerHTML = '';

    liste.forEach(e => {
      const tr = document.createElement('tr');

      tr.innerHTML =
        '<td class="js">' + e.datei + '</td>' +
        '<td class="tr">' + e.tr + '</td>' +
        '<td class="maya">' + e.maya + '</td>' +
        '<td class="inka">' + e.inka + '</td>' +
        '<td class="' + (e.geladen ? 'ok' : 'no') + '">' +
        (e.geladen ? '✓ yüklü' : '✗ yok') +
        '</td>';

      tb.appendChild(tr);
    });
  }

  // ------------------------------------------------------------
  // ÇİZ — das Marker-Canvas
  // ------------------------------------------------------------
  function ciz() {
    const c = document.getElementById('cm');
    if (!c) return;
    const ctx = c.getContext('2d');

    const liste = hep();
    const geladen = liste.filter(e => e.geladen).length;
    const gesamt = liste.length;
    const p = gesamt ? geladen / gesamt : 0;

    const cx = 100, cy = 100, r = 80;

    ctx.clearRect(0, 0, c.width, c.height);

    // Hintergrund-Kreis
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.strokeStyle = '#1a1a2a';
    ctx.lineWidth = 4;
    ctx.stroke();

    // Fortschritts-Bogen
    const s = -Math.PI / 2;
    const e = s + Math.PI * 2 * p;

    ctx.beginPath();
    ctx.arc(cx, cy, r, s, e);
    ctx.strokeStyle = p === 1 ? '#00ffaa' : '#ffcc44';
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.stroke();

    // Zahl in der Mitte
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 28px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(geladen + '/' + gesamt, cx, cy - 8);

    // Labels
    ctx.fillStyle = '#5fc8ff';
    ctx.font = '10px monospace';
    ctx.fillText('nefes', cx, cy + 12);

    ctx.fillStyle = '#ffcc44';
    ctx.font = '9px monospace';
    ctx.fillText(p === 1 ? 'rund' : 'yarım', cx, cy + 26);
  }

  // ------------------------------------------------------------
  // DURUM — Zustand live
  // ------------------------------------------------------------
  function durum() {
    const liste = hep();
    const g = liste.filter(e => e.geladen).length;
    const t = liste.length;

    const n = g;
    const maya = n === 0 ? 'ma\'' : n === 1 ? 'hun' : n === 2 ? 'ka' : n <= 4 ? 'ox' : 'kan';
    const inka = n === 0 ? 'mana' : n === 1 ? 'huk' : n === 2 ? 'iskay' : n <= 4 ? 'kimsa' : 'tawa';

    const dy = document.getElementById('d-y');
    const dt = document.getElementById('d-t');
    const dm = document.getElementById('d-maya');
    const di = document.getElementById('d-inka');
    const dtt = document.getElementById('d-t-t');

    if (dy) dy.textContent = g;
    if (dt) dt.textContent = t;
    if (dm) dm.textContent = maya;
    if (di) di.textContent = inka;
    if (dtt) dtt.textContent = ((now() - start) / 1000).toFixed(1);

    return { geladen: g, gesamt: t, maya, inka, p: t ? g / t : 0 };
  }

  // ------------------------------------------------------------
  // TICK — läuft weiter
  // ------------------------------------------------------------
  function tick() {
    durum();
    requestAnimationFrame(tick);
  }

  // ------------------------------------------------------------
  // SCAN — öffentlich: was ist da, was fehlt
  // ------------------------------------------------------------
  window.scan = function () {
    const liste = hep();
    return {
      runtime: 'nefes',
      anzahl: liste.length,
      geladen: liste.filter(e => e.geladen).length,
      fehlt: liste.filter(e => !e.geladen).map(e => e.datei),
      da: liste.filter(e => e.geladen).map(e => e.datei),
      liste: liste,
      maya: durum().maya,
      inka: durum().inka,
      saat: new Date().toISOString()
    };
  };

  // ------------------------------------------------------------
  // START
  // ------------------------------------------------------------
  function starten() {
    yaz();
    ciz();
    tick();

    // Tabelle neu zeichnen, wenn später was lädt
    setInterval(() => {
      yaz();
      ciz();
    }, 2000);

    // Erster Scan in der Konsole
    if (window.console) {
      const s = window.scan();
      console.log('[nefes runtime]', s.geladen + '/' + s.anzahl, 'yüklü');
      if (s.fehlt.length) console.log('[nefes runtime] fehlt:', s.fehlt);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', starten);
  } else {
    starten();
  }
})();
</script>

</body>
</html>
