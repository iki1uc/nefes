<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>nefes · giriş · kapı</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#05050c;color:#eee;
            font-family:monospace;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh}

  /* Tür — der Eingang */
  #tuer{
    position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(5,5,12,0.95);backdrop-filter:blur(4px);
    z-index:100;transition:opacity .6s,visibility .6s
  }
  #tuer.offen{opacity:0;visibility:hidden}
  #tuerInner{max-width:420px;padding:32px 24px;text-align:center}
  #tuerInner h1{color:#ffcc44;font-size:20px;margin:0 0 6px;font-weight:normal;letter-spacing:2px}
  #tuerInner .hauch{color:#5fc8ff;font-size:11px;margin-bottom:28px}
  #tuerInner .hauch .maya{color:#00ffaa}
  #tuerInner .hauch .inka{color:#ff0066}
  #tuerInner p{color:#888;font-size:12px;line-height:1.8;margin:0 0 20px}
  #tuerInner .knopf{
    padding:14px 32px;background:rgba(0,255,170,0.05);color:#00ffaa;
    border:1px solid #00ffaa;border-radius:4px;cursor:pointer;
    font-family:monospace;font-size:14px;letter-spacing:2px;
    transition:all .3s
  }
  #tuerInner .knopf:hover{background:rgba(0,255,170,0.15);letter-spacing:3px}
  #tuerInner .nie{color:#ff0066;font-size:10px;margin-top:24px;font-style:italic}

  /* Menü — nach der Tür */
  #menu{
    position:fixed;inset:0;padding:24px 16px 100px;
    overflow-y:auto;display:none
  }
  #menu.aktiv{display:block}
  #menuInner{max-width:640px;margin:0 auto}
  #menu h2{color:#ffcc44;font-size:16px;margin:0 0 4px;font-weight:normal;letter-spacing:1px}
  #menu .hauch{color:#5fc8ff;font-size:11px;margin-bottom:24px}
  #menu .hauch .maya{color:#00ffaa}
  #menu .hauch .inka{color:#ff0066}

  /* Einträge */
  .eintrag{
    display:block;padding:14px 16px;margin:6px 0;
    background:rgba(255,255,255,0.02);border:1px solid #1a1a2a;
    border-left:3px solid #1a1a2a;border-radius:0 6px 6px 0;
    cursor:pointer;transition:all .25s;text-decoration:none;color:#eee;
    position:relative
  }
  .eintrag:hover{border-left-color:#00ffaa;background:rgba(0,255,170,0.03);
                 padding-left:20px}
  .eintrag.aktiv{border-left-color:#ffcc44;background:rgba(255,204,68,0.05)}
  .eintrag .name{color:#ffcc44;font-size:14px;font-weight:bold;letter-spacing:1px}
  .eintrag .was{color:#eee;font-size:12px;margin-top:3px}
  .eintrag .hauch{color:#666;font-size:10px;margin-top:3px}
  .eintrag .hauch .maya{color:#00ffaa}
  .eintrag .hauch .inka{color:#ff0066}
  .eintrag .pfeil{
    position:absolute;right:16px;top:50%;transform:translateY(-50%);
    color:#333;font-size:16px;transition:all .25s
  }
  .eintrag:hover .pfeil{color:#00ffaa;right:12px}

  /* Panel — was aufgeht */
  .panel{
    display:none;padding:20px;margin:8px 0 16px;
    background:rgba(0,255,170,0.02);border:1px solid #1a3a2a;
    border-radius:6px
  }
  .panel.aktiv{display:block}
  .panel h3{color:#ffcc44;font-size:13px;margin:0 0 4px;font-weight:normal;letter-spacing:1px}
  .panel .hauch{color:#5fc8ff;font-size:10px;margin-bottom:16px}
  .panel .hauch .maya{color:#00ffaa}
  .panel .hauch .inka{color:#ff0066}

  .feld{margin:10px 0}
  .feld label{display:block;color:#5fc8ff;font-size:10px;margin-bottom:4px;letter-spacing:1px}
  .feld input,.feld select{
    width:100%;padding:9px;background:#05050c;color:#eee;
    border:1px solid #1a1a2a;border-radius:4px;font-family:monospace;
    font-size:13px;transition:border .2s
  }
  .feld input:focus,.feld select:focus{outline:none;border-color:#00ffaa}

  .knopf{
    margin-top:12px;padding:10px 18px;background:rgba(0,255,170,0.05);
    color:#00ffaa;border:1px solid #00ffaa;border-radius:4px;
    cursor:pointer;font-family:monospace;font-size:12px;letter-spacing:1px;
    transition:all .2s
  }
  .knopf:hover{background:rgba(0,255,170,0.15);letter-spacing:2px}
  .knopf.warn{color:#ff0066;border-color:#ff0066;background:rgba(255,0,102,0.05)}
  .knopf.warn:hover{background:rgba(255,0,102,0.15)}

  .ergebnis{
    margin-top:12px;padding:14px;background:rgba(0,255,170,0.03);
    border-left:3px solid #00ffaa;border-radius:0 4px 4px 0;
    font-size:12px;line-height:1.8;white-space:pre-wrap
  }
  .ergebnis .tr{color:#ffcc44}
  .ergebnis .maya{color:#00ffaa}
  .ergebnis .inka{color:#ff0066}
  .ergebnis .nie{color:#ff0066;font-weight:bold}
  .ergebnis .prozent{color:#5fc8ff}

  /* Ausgang — Tür zurück */
  #ausgang{
    position:fixed;bottom:20px;right:20px;
    padding:10px 20px;background:rgba(255,0,102,0.05);
    color:#ff0066;border:1px solid #ff0066;border-radius:4px;
    cursor:pointer;font-family:monospace;font-size:11px;
    letter-spacing:2px;z-index:50;transition:all .3s
  }
  #ausgang:hover{background:rgba(255,0,102,0.15);letter-spacing:3px}

  /* Status */
  #status{
    position:fixed;bottom:20px;left:20px;
    padding:8px 14px;background:rgba(5,5,12,0.85);
    border:1px solid #1a1a2a;border-radius:4px;
    font-size:10px;line-height:1.6;color:#666;z-index:50
  }
  #status b{color:#ffcc44}
</style>
</head>
<body>

<canvas id="c"></canvas>

<!-- ============================================================ -->
<!-- DIE TÜR — doo(r) do it r now                                  -->
<!-- ============================================================ -->
<div id="tuer">
  <div id="tuerInner">
    <h1>nefes</h1>
    <div class="hauch">
      <span class="maya">maya · ik'</span> ·
      <span class="inka">inka · samay</span> ·
      türkçe · kapı
    </div>
    <p>
      bir nefes · ein Atem<br>
      bir nokta · ein Punkt<br>
      bir yapı · eine Struktur
    </p>
    <button class="knopf" onclick="kapı.ac()">kapıyı aç · öffne</button>
    <div class="nie">doo(r) · do it r now</div>
  </div>
</div>

<!-- ============================================================ -->
<!-- MENÜ — nach der Tür                                           -->
<!-- ============================================================ -->
<div id="menu">
  <div id="menuInner">
    <h2>nefes · menü</h2>
    <div class="hauch">
      <span class="maya">maya · hun</span> ·
      <span class="inka">inka · huk</span> ·
      türkçe · liste
    </div>

    <div id="eintraege"></div>
  </div>
</div>

<!-- Ausgang — Tür zurück -->
<button id="ausgang" onclick="kapı.kapa()">← kapı · tür</button>

<!-- Status -->
<div id="status">
  yüklü: <b id="st-y">0</b>/<b id="st-t">0</b> ·
  <b id="st-z">bereit</b>
</div>

<!-- ============================================================ -->
<!-- SCRIPTS                                                       -->
<!-- ============================================================ -->
<script>
  window.__bir = false;
  fetch('bir.html', { method: 'HEAD' })
    .then(function (r) { window.__bir = r.ok; })
    .catch(function () { window.__bir = false; });
</script>

<script src="bu.js"></script>
<script src="su.js"></script>
<script src="nefes.js"></script>
<script src="iki.js"></script>
<script src="uc.js"></script>
<script src="ki.js"></script>

<script src="dur.js"></script>
<script src="durdur.js"></script>
<script src="ikilem.js"></script>
<script src="hal.js"></script>
<script src="kaygıyı.js"></script>

<script src="sor.js"></script>

<script src="list.js"></script>
<script src="run.js"></script>

<script>
// ============================================================
// index.html — die Tür
// Türkçe arbeitet. Maya und Inka flüstern.
// Doo(r) — do it r now.
// ============================================================
(function () {
  'use strict';

  // ============================================================
  // KAPI — die Tür
  // ============================================================
  const kapı = {
    ac: function () {
      const t = document.getElementById('tuer');
      const m = document.getElementById('menu');
      t.classList.add('offen');
      m.classList.add('aktiv');
      setTimeout(function () {
        baueMenü();
      }, 100);
    },
    kapa: function () {
      const t = document.getElementById('tuer');
      const m = document.getElementById('menu');
      m.classList.remove('aktiv');
      t.classList.remove('offen');
      document.querySelectorAll('.panel').forEach(function (p) {
        p.classList.remove('aktiv');
      });
    }
  };
  window.kapı = kapı;

  // ============================================================
  // MENÜ BAUEN — aus list.js
  // ============================================================
  function baueMenü() {
    const box = document.getElementById('eintraege');
    if (!box || box.children.length > 0) return;

    const liste = (window.list && window.list.alle)
      ? window.list.alle()
      : [];

    liste.forEach(function (e) {
      // Eintrag
      const div = document.createElement('div');
      div.className = 'eintrag';
      div.setAttribute('data-ziel', e.id);

      const geladen = window[e.id] !== undefined;

      div.innerHTML =
        '<div class="name">' + e.id + '</div>' +
        '<div class="was">' + e.was + '</div>' +
        '<div class="hauch">' +
          '<span class="maya">maya · ' + e.maya + '</span> · ' +
          '<span class="inka">inka · ' + e.inka + '</span>' +
        '</div>' +
        '<span class="pfeil">›</span>';

      // Klick → Panel
      div.addEventListener('click', function () {
        const ziel = div.getAttribute('data-ziel');
        document.querySelectorAll('.eintrag').forEach(function (x) {
          x.classList.remove('aktiv');
        });
        div.classList.add('aktiv');

        // Tür-Sonderfall
        if (ziel === 'door') {
          zeigTuerInfo(div);
          return;
        }

        // Panel öffnen
        let panel = document.getElementById('p-' + ziel);
        if (!panel) {
          panel = bauePanel(e);
        }
        document.querySelectorAll('.panel').forEach(function (p) {
          p.classList.remove('aktiv');
        });
        panel.classList.add('aktiv');
      });

      box.appendChild(div);
    });
  }

  // ============================================================
  // PANEL BAUEN — je nach Ziel
  // ============================================================
  function bauePanel(e) {
    const panel = document.createElement('div');
    panel.className = 'panel';
    panel.id = 'p-' + e.id;

    let html = '<h3>' + e.id + ' · ' + e.was + '</h3>';
    html += '<div class="hauch">' +
            '<span class="maya">maya · ' + e.maya + '</span> · ' +
            '<span class="inka">inka · ' + e.inka + '</span>' +
            '</div>';

    // Je nach Ziel: Formular
    if (e.id === 'bu') {
      html += '<div class="feld"><label>sayı · Zahl (1-21)</label>' +
              '<input id="bu-n" type="number" min="1" max="21" value="1"></div>' +
              '<button class="knopf" onclick="bu.zeig()">zeig</button>' +
              '<div class="ergebnis" id="bu-ergebnis"></div>';
    } else if (e.id === 'klar') {
      html += '<div class="feld"><label>işaret · Zeichen</label>' +
              '<input id="klar-x" placeholder="örn. ateş"></div>' +
              '<button class="knopf" onclick="klarAktion()">ekle</button>' +
              '<div class="ergebnis" id="klar-ergebnis">henüz yok</div>';
    } else if (e.id === 'dur' || e.id === 'durdur') {
      html += '<div class="feld"><label>neden · Ursache</label>' +
              '<input id="dur-x" placeholder="örn. gürültü"></div>' +
              '<button class="knopf warn" onclick="durdurAktion()">dur</button>' +
              '<div class="ergebnis" id="dur-ergebnis">serbest</div>';
    } else if (e.id === 'fal') {
      html += '<div class="feld"><label>sayı · Zahl (1-21)</label>' +
              '<input id="fal-n" type="number" min="1" max="21" value="4"></div>' +
              '<button class="knopf" onclick="falZeig()">deuten</button>' +
              '<div class="ergebnis" id="fal-ergebnis"></div>';
    } else if (e.id === 'ki') {
      html += '<div class="feld"><label>zeichen (komma-getrennt)</label>' +
              '<input id="ki-x" placeholder="ateş, ağrı"></div>' +
              '<button class="knopf" onclick="kiZeig()">klar</button>' +
              '<div class="ergebnis" id="ki-ergebnis"></div>';
    } else if (e.id === 'sor') {
      html += '<div class="feld"><label>soru · Frage</label>' +
              '<input id="sor-x" placeholder="was ist?"></div>' +
              '<button class="knopf" onclick="sorZeig()">(((sor)))</button>' +
              '<div class="ergebnis" id="sor-ergebnis"></div>';
    } else {
      // Standard — nur Info
      html += '<div class="ergebnis">';
      html += '<span class="tr">yüklü · geladen:</span> ' +
              (window[e.id] !== undefined ? '✓ evet' : '✗ hayır') + '\n';
      html += '<span class="tr">türkçe:</span> ' + e.tr + '\n';
      html += '<span class="maya">maya:</span> ' + e.maya + '\n';
      html += '<span class="inka">inka:</span> ' + e.inka;
      html += '</div>';
    }

    panel.innerHTML = html;
    document.getElementById('eintraege').after(panel);
    return panel;
  }

  // ============================================================
  // DOOR — die Tür im Menü
  // ============================================================
  function zeigTuerInfo(parent) {
    // Panel entfernen falls da
    document.querySelectorAll('.panel').forEach(function (p) {
      p.classList.remove('aktiv');
    });

    // Nachricht anzeigen
    alert('doo(r)\ndo it r now\n\ndie Tür ist das, was fehlt.\ndas, was noch nicht da ist.\n\nama: sen buradasın.\nnefes alıyorsun.\nbu yeter.');
  }

  // ============================================================
  // AKTIONEN
  // ============================================================
  window.bu = window.bu || {};
  window.bu.zeig = function () {
    const n = parseInt(document.getElementById('bu-n').value, 10) || 1;
    const r = window.bu.bak ? window.bu.bak(n) : null;
    if (!r) return;
    let txt = '';
    txt += '<span class="tr">sayı:</span> ' + r.sayi + '\n';
    txt += '<span class="tr">türkçe:</span> ' + r.tr + '\n';
    txt += '<span class="maya">maya:</span> ' + r.maya + '\n';
    txt += '<span class="inka">inka:</span> ' + r.inka + '\n';
    txt += '<span class="tr">anlam:</span> ' + r.anlam + '\n\n';
    txt += 'sonraki: ' + r.naechste;
    document.getElementById('bu-ergebnis').innerHTML = txt;
  };

  window.klarAktion = function () {
    const x = document.getElementById('klar-x').value;
    if (!x || !window.klar || !window.klar.ekle) return;
    window.klar.ekle(x);
    const d = window.klar.durum();
    let txt = '<span class="tr">durum:</span> ' + d.durum + '\n';
    txt += '<span class="maya">maya ' + d.maya + '</span> · ';
    txt += '<span class="inka">inka ' + d.inka + '</span>\n\n';
    txt += d.hinweis;
    document.getElementById('klar-ergebnis').innerHTML = txt;
    document.getElementById('klar-x').value = '';
  };

  window.durdurAktion = function () {
    const x = document.getElementById('dur-x').value || 'bilinmiyor';
    if (!window.durdur || !window.durdur.durdur) return;
    const r = window.durdur.durdur(x);
    let txt = '<span class="tr">neden:</span> ' + r.neden + '\n';
    txt += '<span class="tr">sonuç:</span> ' + r.sonuç + '\n';
    txt += '<span class="maya">maya ' + r.maya + '</span> · ';
    txt += '<span class="inka">inka ' + r.inka + '</span>';
    document.getElementById('dur-ergebnis').innerHTML = txt;
    document.getElementById('dur-x').value = '';
  };

  window.falZeig = function () {
    const n = parseInt(document.getElementById('fal-n').value, 10) || 4;
    const r = window.fal && window.fal.vier ? window.fal.vier(n) : null;
    if (!r) {
      document.getElementById('fal-ergebnis').innerHTML = 'fal.js yok veya vier() yok';
      return;
    }
    let txt = '';
    txt += '<span class="tr">' + r.sayi + ' · ' + r.tr + '</span>\n\n';
    txt += '<span class="tr">mana:</span> ' + r.mana + '\n\n';
    txt += '<span class="tr">aura:</span> ' + r.aura + '\n\n';
    txt += '<span class="tr">yankı:</span> ' + r.yankı + '\n\n';
    txt += '<span class="tr">alan:</span> ' + r.alan + '\n\n';
    txt += '<span class="tr">zen:</span> ' + r.zen;
    document.getElementById('fal-ergebnis').innerHTML = txt;
  };

  window.kiZeig = function () {
    const x = document.getElementById('ki-x').value || '';
    const teile = x.split(',').map(function (s) { return s.trim(); }).filter(Boolean);
    if (!window.ki) return;
    teile.forEach(function (t) { window.ki.set(t, 1); });
    const r = window.ki.klar.apply(null, teile);
    let txt = '<span class="tr">art:</span> ' + (r.art || r.grund) + '\n';
    txt += '<span class="maya">maya ' + r.maya + '</span> · ';
    txt += '<span class="inka">inka ' + r.inka + '</span>\n\n';
    txt += r.hinweis;
    document.getElementById('ki-ergebnis').innerHTML = txt;
  };

  window.sorZeig = function () {
    const x = document.getElementById('sor-x').value || 'bilinmiyor';
    if (!window.sor || !window.sor.vier) return;
    const r = window.sor.vier(x);
    let txt = '<span class="tr">was:</span> ' + r.was + '\n\n';
    txt += '<span class="maya">mana:</span> ' + JSON.stringify(r.mana.was) + '\n';
    txt += '<span class="inka">aura:</span> ' + JSON.stringify(r.aura.was) + '\n';
    txt += '<span class="tr">yankı:</span> ' + JSON.stringify(r.yankı.was) + '\n';
    txt += '<span class="tr">alan:</span> ' + JSON.stringify(r.alan.was) + '\n\n';
    txt += '<span class="tr">zen:</span> ' + r.zen;
    document.getElementById('sor-ergebnis').innerHTML = txt;
  };

  // ============================================================
  // STATUS — yüklü/total
  // ============================================================
  function aktualisiereStatus() {
    if (!window.run || !window.run.zustand) return;
    const z = window.run.zustand();
    const y = document.getElementById('st-y');
    const t = document.getElementById('st-t');
    const s = document.getElementById('st-z');
    if (y) y.textContent = z.da;
    if (t) t.textContent = z.gesamt;
    if (s) {
      s.textContent = z.zustand;
      s.style.color = z.zustand === 'rund' ? '#00ffaa' : '#ffcc44';
    }
  }

  setInterval(aktualisiereStatus, 2000);
  setTimeout(aktualisiereStatus, 500);

  // ============================================================
  // WÜRFEL — im Hintergrund, sanft
  // ============================================================
  const c = document.getElementById('c');
  const ctx = c.getContext('2d');

  function resize() {
    c.width = window.innerWidth;
    c.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  const now = (window.performance && performance.now)
    ? performance.now.bind(performance)
    : Date.now;
  const start = now();
  const raf = window.requestAnimationFrame || (cb => setTimeout(cb, 16));

  const ATOME = [
    { x: -1, y: -1, z: -1 }, { x: 1, y: -1, z: -1 },
    { x: -1, y: 1, z: -1 }, { x: 1, y: 1, z: -1 },
    { x: -1, y: -1, z: 1 }, { x: 1, y: -1, z: 1 },
    { x: -1, y: 1, z: 1 }, { x: 1, y: 1, z: 1 }
  ];
  const KANTEN = [
    [0,1],[0,2],[1,3],[2,3],[4,5],[4,6],[5,7],[6,7],
    [0,4],[1,5],[2,6],[3,7]
  ];

  function rotiere(p, t) {
    const cy = Math.cos(t * 0.2), sy = Math.sin(t * 0.2);
    let x1 = p.x * cy - p.z * sy;
    let z1 = p.x * sy + p.z * cy;
    const cx = Math.cos(t * 0.15), sx = Math.sin(t * 0.15);
    let y1 = p.y * cx - z1 * sx;
    let z2 = p.y * sx + z1 * cx;
    return { x: x1, y: y1, z: z2 };
  }

  function proj(p, cx, cy, skala) {
    const e = 5;
    const z = p.z + e;
    const f = skala / z;
    return { x: cx + p.x * f, y: cy + p.y * f, z: z, f: f };
  }

  function draw() {
    const t = (now() - start) / 1000;

    ctx.fillStyle = '#05050c';
    ctx.fillRect(0, 0, c.width, c.height);

    const cx = c.width / 2;
    const cy = c.height / 2;
    const skala = Math.min(c.width, c.height) * 0.22;

    const projiziert = ATOME.map(function (a) {
      return proj(rotiere(a, t), cx, cy, skala);
    });

    KANTEN.forEach(function (k) {
      const a = projiziert[k[0]];
      const b = projiziert[k[1]];
      const alpha = Math.max(0.05, 1 - (a.z + b.z - 10) / 5);
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.strokeStyle = 'rgba(0,255,170,' + (alpha * 0.25) + ')';
      ctx.lineWidth = 1;
      ctx.stroke();
    });

    projiziert.forEach(function (p) {
      const r = Math.max(1.5, p.f * 0.06);
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0,255,170,0.4)';
      ctx.fill();
    });

    raf(draw);
  }

  draw();

})();
</script>

</body>
