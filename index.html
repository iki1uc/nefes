<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>nefes · rehber · 3 → 9 → 81 → 3</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#05050c;color:#eee;
            font-family:monospace;overflow:hidden}

  #buehne{position:fixed;inset:0;display:flex;
          flex-direction:column;align-items:center;
          justify-content:center;padding:20px}

  #kopf{text-align:center;margin-bottom:20px}
  #kopf h1{color:#ffcc44;font-size:16px;margin:0 0 4px;
           font-weight:normal;letter-spacing:2px}
  #kopf .hauch{color:#5fc8ff;font-size:10px}
  #kopf .hauch .maya{color:#00ffaa}
  #kopf .hauch .inka{color:#ff0066}

  #stufen{display:flex;gap:10px;margin-bottom:24px}
  .stufe{
    padding:6px 16px;background:rgba(255,255,255,0.02);
    border:1px solid #1a1a2a;border-radius:20px;
    color:#555;font-size:11px;letter-spacing:1px;
    transition:all .3s;cursor:pointer
  }
  .stufe:hover{border-color:#5fc8ff;color:#5fc8ff}
  .stufe.aktiv{border-color:#ffcc44;color:#ffcc44;
               background:rgba(255,204,68,0.08)}
  .stufe.passiert{border-color:#00ffaa;color:#00ffaa;
                  background:rgba(0,255,170,0.05)}

  #feld{
    width:100%;max-width:720px;min-height:340px;
    background:rgba(5,5,12,0.7);border:1px solid #1a3a2a;
    border-radius:8px;padding:24px;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    position:relative;overflow:hidden
  }

  /* 3 · Drei Stimmen */
  .drei{display:flex;gap:32px;justify-content:center;
        flex-wrap:wrap}
  .stimme{
    width:120px;height:120px;border-radius:50%;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    border:2px solid #1a1a2a;cursor:pointer;
    transition:all .3s;position:relative
  }
  .stimme:hover{transform:scale(1.05)}
  .stimme.maya{border-color:#00ffaa;color:#00ffaa;
               box-shadow:0 0 20px rgba(0,255,170,0.15)}
  .stimme.inka{border-color:#ff0066;color:#ff0066;
               box-shadow:0 0 20px rgba(255,0,102,0.15)}
  .stimme.sen{border-color:#ffcc44;color:#ffcc44;
              box-shadow:0 0 20px rgba(255,204,68,0.15)}
  .stimme .ad{font-size:14px;font-weight:bold;letter-spacing:1px}
  .stimme .rol{font-size:9px;color:#888;margin-top:4px}
  .stimme .nokta{position:absolute;bottom:8px;font-size:8px;color:#555}

  /* 9 · Neun Dialoge */
  .neun{
    display:grid;grid-template-columns:repeat(3,1fr);
    gap:10px;width:100%
  }
  .dialog{
    padding:12px;background:rgba(255,255,255,0.02);
    border:1px solid #1a1a2a;border-radius:6px;
    font-size:11px;transition:all .2s;cursor:pointer;
    text-align:center
  }
  .dialog:hover{border-color:#00ffaa;
                background:rgba(0,255,170,0.04)}
  .dialog .paar{color:#ffcc44;letter-spacing:1px}
  .dialog .nr{color:#555;font-size:9px;margin-top:3px}
  .dialog .klang{color:#5fc8ff;font-size:9px;margin-top:3px}

  /* 81 · Das Netz */
  .netz{
    display:grid;grid-template-columns:repeat(9,1fr);
    gap:3px;width:100%;max-width:520px
  }
  .knoten{
    aspect-ratio:1;background:rgba(255,255,255,0.02);
    border:1px solid #1a1a2a;border-radius:2px;
    display:flex;align-items:center;justify-content:center;
    font-size:8px;color:#555;cursor:pointer;
    transition:all .15s
  }
  .knoten:hover{background:rgba(0,255,170,0.1);
                border-color:#00ffaa;color:#00ffaa;
                transform:scale(1.2);z-index:2}
  .knoten.maya{border-color:#0a3a2a}
  .knoten.inka{border-color:#3a0a1a}
  .knoten.sen{border-color:#3a2a0a}

  /* Rückkehr */
  .rueckkehr{text-align:center}
  .rueckkehr .kreis{
    width:160px;height:160px;border-radius:50%;
    border:1px dashed #ffcc44;margin:0 auto 20px;
    display:flex;align-items:center;justify-content:center;
    animation:dreh 12s linear infinite
  }
  @keyframes dreh{to{transform:rotate(360deg)}}
  .rueckkehr .kreis .in{
    color:#ffcc44;font-size:28px;
    animation:gegendreh 12s linear infinite
  }
  @keyframes gegendreh{to{transform:rotate(-360deg)}}
  .rueckkehr h2{color:#ffcc44;font-weight:normal;
                font-size:14px;letter-spacing:2px;
                margin:0 0 8px}
  .rueckkehr p{color:#888;font-size:11px;
               line-height:1.7;margin:0}

  /* Steuerung */
  #steuerung{
    position:fixed;bottom:20px;left:50%;
    transform:translateX(-50%);
    display:flex;gap:8px;z-index:10
  }
  .knopf{
    padding:10px 20px;background:rgba(0,255,170,0.05);
    color:#00ffaa;border:1px solid #00ffaa;border-radius:4px;
    cursor:pointer;font-family:monospace;font-size:12px;
    letter-spacing:1px;transition:all .2s
  }
  .knopf:hover{background:rgba(0,255,170,0.15);
               letter-spacing:2px}
  .knopf.warn{color:#ff0066;border-color:#ff0066;
              background:rgba(255,0,102,0.05)}
  .knopf.warn:hover{background:rgba(255,0,102,0.15)}

  #status{
    position:fixed;bottom:20px;right:20px;
    padding:8px 14px;background:rgba(5,5,12,0.85);
    border:1px solid #1a1a2a;border-radius:4px;
    font-size:10px;line-height:1.6;color:#666
  }
  #status b{color:#ffcc44}
  #status .ok{color:#00ffaa}
  #status .no{color:#ff0066}

  #info{
    position:fixed;top:20px;right:20px;
    padding:8px 14px;background:rgba(5,5,12,0.85);
    border:1px solid #1a1a2a;border-radius:4px;
    font-size:10px;line-height:1.6;color:#666;
    max-width:220px
  }
  #info b{color:#5fc8ff}
</style>
</head>
<body>

<div id="buehne">

  <div id="kopf">
    <h1>nefes · rehber</h1>
    <div class="hauch">
      <span class="maya">maya · ik'</span> ·
      <span class="inka">inka · samay</span> · türkçe
    </div>
  </div>

  <div id="stufen">
    <div class="stufe" data-s="3">3</div>
    <div class="stufe" data-s="9">9</div>
    <div class="stufe" data-s="81">81</div>
    <div class="stufe" data-s="rueck">↺ 3</div>
  </div>

  <div id="feld"></div>

</div>

<div id="steuerung">
  <button class="knopf" onclick="rehber.zurueck()">← geri</button>
  <button class="knopf" onclick="rehber.weiter()">ileri →</button>
  <button class="knopf warn" onclick="rehber.reloop()">↺ reloop</button>
</div>

<div id="info">
  <b>3</b> · ses · Stimmen<br>
  <b>9</b> · diyalog · Dialoge<br>
  <b>81</b> · ağ · Netz<br>
  <b>↺ 3</b> · dönüş · Rückkehr
</div>

<div id="status">
  stufe: <b id="st-s">3</b> ·
  durum: <b id="st-d" class="ok">hazır</b>
</div>

<script>
(function(){
'use strict';

const feld = document.getElementById('feld');
const stS = document.getElementById('st-s');
const stD = document.getElementById('st-d');

const STIMMEN = [
  { id:'maya', ad:'maya', rol:'ik\' · içeride kalır', klasse:'maya' },
  { id:'inka', ad:'inka', rol:'samay · dışarı yayılır', klasse:'inka' },
  { id:'sen',  ad:'sen',  rol:'buradasın · du bist hier', klasse:'sen' }
];

const STUFEN = ['3', '9', '81', 'rueck'];
let aktuell = 0;

// ============================================================
// STUFE 3 — Drei Stimmen
// ============================================================
function zeig3(){
  let html = '<div class="drei">';
  STIMMEN.forEach(function(s, i){
    html += '<div class="stimme '+s.klasse+'" '+
            'onclick="rehber.stimmeKlick(\''+s.id+'\')">'+
            '<div class="ad">'+s.ad+'</div>'+
            '<div class="rol">'+s.rol+'</div>'+
            '<div class="nokta">'+(i+1)+'/3</div>'+
            '</div>';
  });
  html += '</div>';
  html += '<div style="margin-top:28px;color:#555;'+
          'font-size:10px;text-align:center;line-height:1.8">'+
          'bir nefes · ein Atem<br>'+
          'üç ses · drei Stimmen<br>'+
          '<span style="color:#888">ileri → ile 9\'a geç</span>'+
          '</div>';
  feld.innerHTML = html;
  stS.textContent = '3';
  stD.textContent = 'üç ses';
  stD.className = 'ok';
}

// ============================================================
// STUFE 9 — Drei mal Drei
// ============================================================
function zeig9(){
  let html = '<div class="neun">';
  let nr = 1;
  STIMMEN.forEach(function(a){
    STIMMEN.forEach(function(b){
      const klasse = a.klasse;
      html += '<div class="dialog" '+
              'onclick="rehber.dialogKlick('+nr+',\''+a.id+'\',\''+b.id+'\')">'+
              '<div class="paar">'+a.ad+' × '+b.ad+'</div>'+
              '<div class="nr">'+nr+'/9</div>'+
              '<div class="klang">'+
              (a.id===b.id?'aynı · gleich':'farklı · verschieden')+
              '</div>'+
              '</div>';
      nr++;
    });
  });
  html += '</div>';
  html += '<div style="margin-top:20px;color:#555;'+
          'font-size:10px;text-align:center">'+
          'her ses her sesle konuşur · 9 diyalog'+
          '</div>';
  feld.innerHTML = html;
  stS.textContent = '9';
  stD.textContent = 'dokuz diyalog';
  stD.className = 'ok';
}

// ============================================================
// STUFE 81 — Neun mal Neun
// ============================================================
function zeig81(){
  const V = ['maya', 'inka', 'sen'];
  let html = '<div class="netz">';
  for(let i = 0; i < 81; i++){
    const a = V[i % 3];
    const b = V[Math.floor(i / 3) % 3];
    const klasse = a;
    html += '<div class="knoten '+klasse+'" '+
            'onclick="rehber.knotenKlick('+(i+1)+',\''+a+'\',\''+b+'\')" '+
            'title="'+(i+1)+': '+a+' × '+b+'">'+
            (i+1)+
            '</div>';
  }
  html += '</div>';
  html += '<div style="margin-top:20px;color:#555;'+
          'font-size:10px;text-align:center;line-height:1.8">'+
          '9 × 9 = 81 · tam ağ · volles Netz<br>'+
          '<span style="color:#888">her kutu bir diyalog · '+
          'jedes Feld ein Dialog</span>'+
          '</div>';
  feld.innerHTML = html;
  stS.textContent = '81';
  stD.textContent = 'tam ağ';
  stD.className = 'ok';
}

// ============================================================
// STUFE RÜCKKEHR — Reloop
// ============================================================
function zeigRueck(){
  feld.innerHTML =
    '<div class="rueckkehr">'+
    '<div class="kreis"><div class="in">↺</div></div>'+
    '<h2>3 · geri dönüş</h2>'+
    '<p>'+
    '3 → 9 → 81 → 3<br>'+
    'abr · yok · kein Abbruch<br>'+
    'reloop · evet · ja<br><br>'+
    '<span style="color:#5fc8ff">'+
    'aynı nefes. aynı küp. yeniden başlar.<br>'+
    'derselbe Atem. derselbe Würfel. beginnt neu.'+
    '</span>'+
    '</p>'+
    '</div>';
  stS.textContent = '↺ 3';
  stD.textContent = 'reloop';
  stD.className = 'ok';
}

// ============================================================
// REHBER — die Führung
// ============================================================
const rehber = {

  zeig: function(stufe){
    const s = STUFEN[stufe];
    document.querySelectorAll('.stufe').forEach(function(el){
      el.classList.remove('aktiv', 'passiert');
    });
    document.querySelectorAll('.stufe').forEach(function(el, i){
      if(i < stufe) el.classList.add('passiert');
      if(i === stufe) el.classList.add('aktiv');
    });
    if(s === '3')    zeig3();
    if(s === '9')    zeig9();
    if(s === '81')   zeig81();
    if(s === 'rueck') zeigRueck();
    aktuell = stufe;
  },

  weiter: function(){
    if(aktuell < STUFEN.length - 1){
      rehber.zeig(aktuell + 1);
    } else {
      stD.textContent = 'son · ende';
      stD.className = 'no';
    }
  },

  zurueck: function(){
    if(aktuell > 0){
      rehber.zeig(aktuell - 1);
    }
  },

  reloop: function(){
    rehber.zeig(0);
    stD.textContent = 'reloop · yeniden';
    stD.className = 'ok';
  },

  // ---- Klicks auf Inhalte ----
  stimmeKlick: function(id){
    const s = STIMMEN.find(function(x){ return x.id === id; });
    if(!s) return;
    stD.textContent = s.ad + ' · ' + s.rol;
    stD.className = 'ok';
  },

  dialogKlick: function(nr, a, b){
    stD.textContent = nr + '/9 · ' + a + ' × ' + b;
    stD.className = 'ok';
  },

  knotenKlick: function(nr, a, b){
    stD.textContent = nr + '/81 · ' + a + ' × ' + b;
    stD.className = 'ok';
  }
};

window.rehber = rehber;

// ---- Stufen-Klick ----
document.querySelectorAll('.stufe').forEach(function(el){
  el.addEventListener('click', function(){
    const s = el.getAttribute('data-s');
    const idx = STUFEN.indexOf(s);
    if(idx >= 0) rehber.zeig(idx);
  });
});

// ---- Tastatur ----
document.addEventListener('keydown', function(e){
  if(e.key === 'ArrowRight') { rehber.weiter(); e.preventDefault(); }
  if(e.key === 'ArrowLeft')  { rehber.zurueck(); e.preventDefault(); }
  if(e.key === 'r' || e.key === 'R') { rehber.reloop(); }
  if(e.key === '1') rehber.zeig(0);
  if(e.key === '2') rehber.zeig(1);
  if(e.key === '3') rehber.zeig(2);
  if(e.key === '4') rehber.zeig(3);
});

// ============================================================
// START
// ============================================================
rehber.zeig(0);

})();
</script>
</body>
</html>
